<p-dialog
[header]="dialogTitle"
[modal]="true"
(onShow)="onShow()"
[visible]="visible()"
(visibleChange)="visibleChange.emit($event)"
[style]="{ width: '700px' }"
  [breakpoints]="{ '960px': '90vw', '640px': '95vw' }"
>

<form [formGroup]="FormRole" class="flex flex-col gap-4" (ngSubmit)="save()">
<fieldset class="flex flex-col gap-2">
  <div class="flex flex-col gap-2">
    <label for="name">Nombre: <span class="text-red-400 opacity-80">*</span></label>
    <input
          type="text"
          [class.border-red-400!]="FormRole.get('name')?.invalid"
          [class.border-emerald-400!]="FormRole.get('name')?.valid"
          id="name"
          placeholder="Admin"
          formControlName="name"
          pInputText
        />
        @if (
          FormRole.get('name')?.invalid &&
          (FormRole.get('name')?.dirty || FormRole.get('name')?.touched)
        ) {
          <div class="flex flex-col mt-0">
            <p class="text-red-500 opacity-70 font-semibold text-xs">Este campo es requerido</p>
          </div>
        }
  </div>
  <div class="flex flex-col gap-2">
    <label for="description">Descripción: <span class="text-red-400 opacity-80">*</span></label>
    <textarea
          type="text"
          [class.border-red-400!]="FormRole.get('description')?.invalid"
          [class.border-emerald-400!]="FormRole.get('description')?.valid"
          id="description"
          placeholder="Admin"
          formControlName="description"
          pTextarea
          [rows]="5"
          [cols]="10"
        ></textarea>
        @if (
          FormRole.get('description')?.invalid &&
          (FormRole.get('description')?.dirty || FormRole.get('description')?.touched)
        ) {
          <div class="flex flex-col mt-0">
            <p class="text-red-500 opacity-70 font-semibold text-xs">Este campo es requerido</p>
          </div>
        }
  </div>
</fieldset>
</form>
<ng-template pTemplate="footer">
    <div class="flex justify-end gap-2">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        (onClick)="close()"
        severity="secondary"
        [text]="true"
      />
      <p-button
        (onClick)="save()"
        severity="info"
        [label]="isEditing ? 'Guardar' : 'Crear'"
        icon="pi pi-check"
      />
    </div>
  </ng-template>

</p-dialog>
