<p-toast />
 <p-confirmdialog />

<div class="flex items-center justify-between mb-2 pt-6 ">
<div class="flex flex-col  ml-6">
  <h1 class="text-5xl font-bold opacity-80">Gestión de Servicios Protegidos</h1>
  <p class="text-muted-color mt-2.5 opacity-90 text-gray-400 ">Administra el inventario de recursos y endpoints enrutados bajo la arquitectura.</p>
</div>

<p-button
    tooltipPosition="left"
    pTooltip="Agregar servicio"
    label="Nuevo Servicio"
    icon="pi pi-plus"
    class="text-white border-none text-sm font-semibold px-4 py-2"
    [style]="{ 'background-color': '#9d72ff' }"
    (onClick)="openCreate()"
  ></p-button>
</div>
<p-divider class="bg-[#252233]! mb-6"></p-divider>

<main class="flex flex-col gap-2 pr-10 pl-10">
<app-sevices-card/>

<app-datagrid-services
[data]="data()"
class="w-full min-h-50"
[loading]="loading()"
[buttonOptions]="buttonsOptions"
(paramsGrid)="OnparamsGrid($event)"
[columns]="column"
[totalRecords]="totalRecords()"
/>
</main>

<app-servicesform
[visible]="showActionDialog()"
(saved)="onserviceSaved()"
(visibleChange)="showActionDialog.set($event)"
[ServicesData]="selectedServices()"
/>
